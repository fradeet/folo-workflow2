name: folo-rss-reader-cli
version: 0.1.0

commands:
  - name: auth
    commands:
      - name: login
  - name: timeline
    catch_all: true
    flags:
      - long: --output-format
        arg: format
        allowed: [alfred]
        required: true

environment_variables:
  - name: FOLO_TOKEN
  - name: NODE_USE_ENV_PROXY
    default: "1"
  - name: FRR_CACHE_DIR
    default: /tmp/folo-rss-reader-cli

variables:
  - name: folo_cli_version
    value: latest
